<style>
* {margin: 0; padding: 0; box-sizing: border-box;}
body {background: #0d0d0d; color: #fff; font-family: Arial, sans-serif;}
header {background: #000; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;}
header h1 {font-size: 18px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;}
.banner video {width: 100%; height: 220px; object-fit: cover; display: block;}
.marquee {background: #0d0d0d; color: #00ff88; padding: 8px; font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden;}
.marquee span {display: inline-block; padding-left: 100%; animation: marquee 12s linear infinite;}
@keyframes marquee {0% {transform: translateX(0);} 100% {transform: translateX(-100%);}}
.game-tabs {display: flex; gap: 8px; padding: 12px; overflow-x: auto;}
.tab-btn {padding: 8px 14px; border: 1px solid #ff00ff; background: #1a1a1a; color: #fff; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px;}
.tab-btn.active {background: linear-gradient(90deg, #ff00ff, #00c8ff); color: #000; font-weight: bold;}
.section-title {padding: 15px; font-size: 16px; font-weight: bold;}
.products {display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 20px;}
.card {background: #1a1a1a; border-radius: 12px; overflow: hidden; text-align: center;}
.card img {width: 100%; height: 120px; object-fit: cover;}
.card h3 {font-size: 13px; margin: 10px 5px; min-height: 36px;}
.card button {width: 90%; margin-bottom: 10px; padding: 8px; border: none; border-radius: 8px; background: linear-gradient(90deg, #ff00ff, #00c8ff); color: #000; font-weight: bold; cursor: pointer;}
.modal {display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 999;}
.modal-content {background: #1a1a1a; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #ff00ff; max-height: 80vh; overflow-y: auto;}
.modal h3 {color: #ff00ff; margin-bottom: 15px; text-align: center;}
.produk-block {margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;}
.produk-block h4 {color: #00c8ff; margin-bottom: 8px; text-align: center;}
.produk-block li {padding: 8px 0; border-bottom: 1px solid #222; text-align: center; font-size: 14px; list-style: none;}
.wa-btn {background: #25D366; color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; font-weight: bold; cursor: pointer; font-size: 15px;}
.close-btn {background: #ff4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 10px; font-weight: bold; cursor: pointer;}
</style>
</head>

let gameAktif = 'ff';
let produkPilihan = '';

function renderProducts(){
  const data = allData[gameAktif];
  document.getElementById('gameTitle').innerText = data.title;
  let html = '';
  Object.keys(data.items).forEach(produk => {
    html += `<div class="card">
      <img src="${data.img}">
      <h3>${produk}</h3>
      <button onclick="showPrice('${produk}')">BELI</button>
    </div>`;
  });
  document.getElementById('productList').innerHTML = html;
}

function switchGame(game){
  gameAktif = game;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderProducts();
}

function showPrice(produk){
  produkPilihan = produk;
  const data = allData[gameAktif];
  let html = `<div class="produk-block"><h4>${produk}</h4><ul>`;
  data.items[produk].forEach(item => {
    html += `<li>${item}</li>`;
  });
  html += `</ul></div>`;
  document.getElementById("allListHarga").innerHTML = html;
  document.getElementById("listModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("listModal").style.display = "none";
}

document.getElementById("waBtn").onclick = function(){
  window.open(`https://wa.me/6288983578768?text=bang+topup+${encodeURIComponent(produkPilihan)}+${gameAktif.toUpperCase()}+ID:`, '_blank');
}

renderProducts();
</script>
